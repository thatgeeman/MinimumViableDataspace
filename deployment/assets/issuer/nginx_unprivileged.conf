events {}

http {
  server {
    listen 8080;
    server_name _;
    root /app;

    # allow the well-known path explicitly
    location ^~ /.well-known/ {
      try_files $uri =404;
      allow all;
    }

    # keep other dotfiles blocked
    location ~ /\.(?!well-known) {
      deny all;
    }

    location / {
      try_files $uri =404;
    }
  }
}

